{{- range .Values.availabilityZones }}
{{- if and .kubeconfig (not .existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "viti-mcp.fullname" $ }}-kubeconfig-{{ .name }}
  labels:
    {{- include "viti-mcp.labels" $ | nindent 4 }}
type: Opaque
data:
  kubeconfig: {{ .kubeconfig | b64enc }}
{{- end }}
{{- end }}

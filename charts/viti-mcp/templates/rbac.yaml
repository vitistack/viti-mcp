{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "viti-mcp.fullname" . }}
  labels:
    {{- include "viti-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: ["vitistack.io"]
    resources:
      - kubernetesclusters
      - machines
      - machineclasses
      - machineproviders
      - kubernetesproviders
      - networknamespaces
      - networkconfigurations
      - vitistacks
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "viti-mcp.fullname" . }}
  labels:
    {{- include "viti-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "viti-mcp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "viti-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
